# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d68a7533dbbe676af335f27d01d87a12"
name = "Spark"
application_url = "https://spark-prod.onrender.com"
embedded = true

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "/webhooks/app/subscriptions_update"

[[webhooks.subscriptions]]
topics = ["app_purchases_one_time/update"]
uri = "/webhooks/app/purchases_one_time_update"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

# 以下 5 个含 Protected Customer Data，PCD 未获批前不可订阅；获批后再加回：
# orders/paid, orders/cancelled, refunds/create, fulfillments/create, fulfillments/update
# inventory_levels/update：第一版不做库存镜像同步，暂不订阅

[app_proxy]
  url = "https://spark-prod.onrender.com/api/image-proxy"
  subpath = "ciwi-spark"
  prefix = "a"

[access_scopes]
# 第一版最小集（对应：经营指标实时查询、商品文案/评分/查找、写回文案、语言列表）
# 未包含：translations（归 TSF）、pixels（Web Pixel/广告）、themes（App Embed 检测）、
# reports（ShopifyQL）、fulfillments/inventory/locations（镜像同步）、content（文章）
scopes = "read_orders,read_products,write_products,read_locales"

[auth]
redirect_urls = [
  "https://spark-prod.onrender.com/auth/callback",
  "https://spark-prod.onrender.com/auth/shopify/callback",
]

[build]
automatically_update_urls_on_dev = true

[shop.metafields.app.google_remarketing_config]
type = "json"
name = "Google remarketing configuration"
access.admin = "merchant_read"
