<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark 经营工作流 Demo</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-subtle: #fafbfb;
        --surface-emphasis: #f1f8f5;
        --border: #e1e3e5;
        --border-strong: #c9cdd2;
        --text: #1f2124;
        --text-subtle: #61666c;
        --text-muted: #8c9196;
        --green: #008060;
        --green-bg: #e9f7ef;
        --blue: #005bd3;
        --blue-bg: #eef4ff;
        --orange: #b98900;
        --orange-bg: #fff7e0;
        --red: #d82c0d;
        --red-bg: #fff0ee;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
        --radius-xl: 20px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .sidebar {
        background: linear-gradient(180deg, #f2f3f5 0%, #eef1f4 100%);
        border-right: 1px solid var(--border);
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: #111827;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 800;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
      }

      .brand p,
      .muted {
        margin: 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .workflow-card,
      .nav button,
      .side-panel,
      .card,
      .detail-block,
      .schedule-card,
      .report-card,
      .assistant-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .workflow-card {
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .chip {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .chip.fake {
        background: var(--orange-bg);
        color: #8a6500;
      }

      .chip.green {
        background: var(--green-bg);
        color: var(--green);
      }

      .chip.blue {
        background: var(--blue-bg);
        color: var(--blue);
      }

      .nav {
        display: grid;
        gap: 8px;
      }

      .nav button {
        padding: 12px 14px;
        text-align: left;
        cursor: pointer;
        display: grid;
        gap: 4px;
      }

      .nav button.active {
        border-color: rgba(0, 128, 96, 0.25);
        background: var(--surface-emphasis);
      }

      .nav-title {
        font-size: 14px;
        font-weight: 700;
      }

      .nav-detail {
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-subtle);
      }

      .side-panel {
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .side-panel h3,
      .card h3,
      .detail-block h3,
      .schedule-card h3,
      .report-card h3,
      .assistant-card h3 {
        margin: 0;
        font-size: 14px;
      }

      .main {
        padding: 24px;
        display: grid;
        gap: 18px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.9fr);
        gap: 18px;
      }

      .hero-card {
        padding: 20px;
        border-radius: var(--radius-xl);
        background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .hero-card h2 {
        margin: 8px 0 10px;
        font-size: 30px;
        line-height: 1.15;
      }

      .hero-card p {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-subtle);
        max-width: 800px;
      }

      .hero-actions,
      .summary-grid,
      .workspace-grid,
      .monitor-list,
      .evidence-list {
        display: grid;
        gap: 12px;
      }

      .hero-actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 18px;
      }

      .hero-action {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        padding: 14px;
      }

      .hero-action strong {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }

      .hero-action span {
        color: var(--text-subtle);
        font-size: 12px;
        line-height: 1.5;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
      }

      .metric {
        font-size: 28px;
        font-weight: 800;
        margin: 6px 0 4px;
      }

      .metric-label {
        font-size: 12px;
        color: var(--text-muted);
      }

      .workspace-grid {
        grid-template-columns: 360px minmax(0, 1fr) 360px;
        align-items: start;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 18px;
      }

      .section-title p {
        margin: 4px 0 0;
        color: var(--text-subtle);
        font-size: 12px;
      }

      .monitor-group {
        display: grid;
        gap: 10px;
      }

      .monitor-group-header {
        padding-top: 4px;
      }

      .monitor-group-header strong {
        font-size: 13px;
      }

      .monitor-group-header span {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .monitor-item {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        padding: 14px;
        cursor: pointer;
        display: grid;
        gap: 8px;
      }

      .monitor-item.active {
        border-color: rgba(0, 91, 211, 0.26);
        background: #f8fbff;
      }

      .monitor-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
      }

      .monitor-head strong {
        font-size: 14px;
      }

      .status {
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .status.risk {
        background: var(--red-bg);
        color: var(--red);
      }

      .status.watch {
        background: var(--orange-bg);
        color: #8a6500;
      }

      .status.good {
        background: var(--green-bg);
        color: var(--green);
      }

      .monitor-summary,
      .monitor-meta,
      .evidence-row,
      .recommendation,
      .assistant-card p {
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-subtle);
      }

      .monitor-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        color: var(--text-muted);
      }

      .detail-pane {
        display: grid;
        gap: 14px;
      }

      .detail-hero {
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: linear-gradient(135deg, #ffffff 0%, #f6fbf8 100%);
      }

      .detail-hero h2 {
        margin: 10px 0 8px;
        font-size: 24px;
      }

      .detail-hero p {
        margin: 0;
        color: var(--text-subtle);
        line-height: 1.7;
        font-size: 14px;
      }

      .detail-meta {
        margin-top: 14px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .detail-block {
        padding: 16px;
        display: grid;
        gap: 12px;
      }

      .detail-block-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .detail-block-header span {
        font-size: 12px;
        color: var(--text-muted);
      }

      .problem-statement {
        padding: 14px;
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        border: 1px solid var(--border);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.7;
      }

      .evidence-row {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px dashed var(--border);
      }

      .evidence-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .evidence-row strong {
        color: var(--text);
        font-size: 12px;
      }

      .recommendation {
        padding: 12px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface-subtle);
      }

      .recommendation strong {
        display: block;
        margin-bottom: 4px;
        color: var(--text);
      }

      .assistant-card {
        padding: 16px;
        background: linear-gradient(135deg, #eef4ff 0%, #ffffff 100%);
      }

      .assistant-preview {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(0, 91, 211, 0.16);
        background: rgba(255, 255, 255, 0.78);
        font-size: 12px;
        line-height: 1.7;
        white-space: pre-line;
        color: var(--text-subtle);
      }

      .primary-btn,
      .ghost-btn {
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        cursor: pointer;
        font-weight: 700;
      }

      .primary-btn {
        border: 1px solid var(--green);
        background: var(--green);
        color: #fff;
      }

      .ghost-btn {
        border: 1px solid var(--border-strong);
        background: #fff;
        color: var(--text);
      }

      .action-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .schedule-card,
      .report-card {
        padding: 16px;
      }

      .schedule-card.active {
        border-color: rgba(0, 128, 96, 0.22);
        background: #f7fcf9;
      }

      .overview-stack,
      .health-stack {
        display: grid;
        gap: 18px;
      }

      .overview-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: start;
      }

      .cta-card,
      .progress-card,
      .monitor-section,
      .monitor-result-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .cta-card,
      .progress-card,
      .monitor-section {
        padding: 18px;
      }

      .cta-card h3,
      .progress-card h3,
      .monitor-section h3 {
        margin: 0;
      }

      .cta-card p,
      .progress-card p,
      .monitor-section p {
        margin: 8px 0 0;
        color: var(--text-subtle);
        font-size: 13px;
        line-height: 1.7;
      }

      .page-header-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
      }

      .page-header-row h2 {
        margin: 10px 0 0;
        font-size: 28px;
      }

      .progress-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .progress-metric {
        padding: 14px;
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        border: 1px solid var(--border);
      }

      .progress-metric strong {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .progress-metric span {
        font-size: 26px;
        font-weight: 800;
      }

      .dashboard-groups {
        display: grid;
        gap: 16px;
        margin-top: 16px;
      }

      .dashboard-group {
        padding: 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface-subtle);
      }

      .dashboard-group h4 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .dashboard-list {
        display: grid;
        gap: 10px;
      }

      .dashboard-row {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(120px, 0.7fr) auto;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px dashed var(--border);
      }

      .dashboard-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .dashboard-row-title {
        font-size: 13px;
        font-weight: 700;
      }

      .dashboard-row-value {
        font-size: 13px;
        color: var(--text-subtle);
        text-align: right;
      }

      .progress-bar {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: #edf1f4;
        overflow: hidden;
        margin-top: 14px;
      }

      .progress-bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green) 0%, #37b48b 100%);
      }

      .monitor-board,
      .monitor-result-list {
        display: grid;
        gap: 16px;
      }

      .monitor-section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 14px;
      }

      .monitor-result-card {
        padding: 14px;
        background: var(--surface-subtle);
        display: grid;
        gap: 10px;
      }

      .monitor-result-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .monitor-result-top strong {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .result-progress {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        color: var(--text-muted);
        font-size: 12px;
      }

      .result-summary {
        font-size: 13px;
        line-height: 1.7;
        color: var(--text-subtle);
      }

      .result-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .result-stage {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        background: var(--blue-bg);
        color: var(--blue);
      }

      .schedule-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .schedule-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .mini-pill {
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--surface-subtle);
        border: 1px solid var(--border);
        font-size: 11px;
        color: var(--text-subtle);
      }

      .report-card strong {
        font-size: 13px;
      }

      .report-card .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      @media (max-width: 1400px) {
        .workspace-grid {
          grid-template-columns: 320px minmax(0, 1fr);
        }

        .right-column {
          grid-column: 1 / -1;
        }

        .overview-actions {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 1080px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

        .hero,
        .workspace-grid,
        .summary-grid,
        .hero-actions,
        .progress-grid,
        .overview-actions {
          grid-template-columns: 1fr;
        }

        .main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div>
          <div class="brand">
            <div class="brand-icon">SP</div>
            <div>
              <h1>Spark 经营工作流</h1>
              <p>从零整理用户每天怎么判断、怎么行动。</p>
            </div>
          </div>

          <div class="workflow-card">
            <span class="chip fake">HTML Demo · Fake Data</span>
            <div>
              <strong>这版只回答一个问题：</strong>
              <p class="muted">如果页面彻底重做，用户应该如何从“看问题”走到“进入监测”和“交给 AI / 任务执行”。</p>
            </div>
          </div>

          <div class="nav" style="margin-top: 14px">
            <button class="active">
              <span class="nav-title">1. 监测中心</span>
              <span class="nav-detail">先按健康度分类找问题，而不是在很多功能页里切换。</span>
            </button>
            <button>
              <span class="nav-title">2. 固定详情页</span>
              <span class="nav-detail">每个监测项都固定为：问题、数据论据、解决办法、和 AI 聊聊。</span>
            </button>
            <button>
              <span class="nav-title">3. 执行回到任务</span>
              <span class="nav-detail">建议动作生成后进入现有 Tasks，不单独再造任务页。</span>
            </button>
          </div>
        </div>

        <div class="side-panel">
          <h3>设计原则</h3>
          <div class="muted">1. 用户先看问题，不先看数据海洋。</div>
          <div class="muted">2. 每个监测页格式固定，阅读负担稳定。</div>
          <div class="muted">3. 任务只保留一个收口：现有 Tasks。</div>
        </div>
      </aside>

      <main class="main" id="app-content"></main>
    </div>

    <script>
      const monitors = [
        {
          id: "site-performance",
          group: "商店健康度",
          title: "页面性能",
          status: "watch",
          badge: "关注",
          summary: "移动端 LCP 明显偏慢，首页和重点落地页承接开始影响转化。",
          meta: ["PageSpeed", "首页 / 爆款页", "近 7 天"],
          heroTag: "站点健康度",
          heroTitle: "页面性能正在拖慢核心落地页承接，属于需要优先验证的站点问题",
          heroBody:
            "这类问题不是独立的技术指标页，而是经营问题的一部分。用户在这里应该直接看到它是否在拖累转化，而不是先读 Lighthouse 术语。",
          blockLabel: "站点健康",
          problem:
            "重点落地页的移动端加载体验偏慢，当前已经影响点击后的承接效率，属于会继续拉低转化率的关注项。",
          evidence: [
            { label: "核心指标", value: "LCP 4.8s，超过目标值 2.5s；CLS 0.06，暂时稳定。" },
            { label: "业务影响", value: "来自广告的爆款页会话转化率 1.3%，显著低于站内均值 1.9%。" },
            { label: "对比基准", value: "上周同页 LCP 3.2s，本周下降明显，且问题集中在移动端图片与首屏脚本。" }
          ],
          actions: [
            { title: "先收缩首屏资源", detail: "压缩首图、延后非关键脚本，把首屏交互时间拉回 3 秒内。" },
            { title: "按页面级建立修复优先级", detail: "先修广告主落地页，再修 SEO 核心入口页，避免平均分散处理。" },
            { title: "接入到每日健康度监测", detail: "把首页、爆款页、活动页设成固定监测对象，每天自动复核。" }
          ],
          ai:
            "请基于以下页面性能监测结果，帮我判断它是否已经影响转化，并给出按优先级排序的修复方案。\n\n问题：移动端 LCP 偏慢，广告落地页 CVR 下滑。\n证据：LCP 4.8s；广告落地页 CVR 1.3%，站内均值 1.9%；问题集中在首页与爆款页。\n目标：先判断是不是今天需要马上处理的经营问题，再输出 3 条可以进入任务系统的动作。 "
        },
        {
          id: "seo-health",
          group: "商店健康度",
          title: "SEO 情况",
          status: "good",
          badge: "正常",
          summary: "搜索曝光平稳，但部分高意图页面点击率偏低，适合作为持续优化项。",
          meta: ["Search Console", "自然搜索", "近 28 天"],
          heroTag: "站点健康度",

            </section>
          </section>
        `;
      }

      function bindOverviewEvents() {
        document.querySelectorAll("[data-open-health]").forEach((button) => {
          button.addEventListener("click", () => {
            currentView = "health";
            renderApp();
          });
        });
        document.querySelectorAll("[data-open-detail]").forEach((button) => {
          button.addEventListener("click", () => {
            viewMonitorDetail(button.dataset.openDetail);
          });
        });
      }

      function bindHealthEvents() {
        const back = document.querySelector("[data-back-overview]");
        if (back) {
          back.addEventListener("click", () => {
            currentView = "overview";
            renderApp();
          });
        }
        document.querySelectorAll("[data-open-detail]").forEach((button) => {
          button.addEventListener("click", () => {
            viewMonitorDetail(button.dataset.openDetail);
          });
        });
      }

      function bindDetailEvents() {
        const back = document.querySelector("[data-back-health]");
        if (back) {
          back.addEventListener("click", () => {
            currentView = "health";
            renderApp();
          });
        }
      }

      function renderApp() {
        const root = document.getElementById("app-content");
        if (!root) return;

        if (currentView === "health") {
          root.innerHTML = renderHealthMonitoring();
          bindHealthEvents();
          return;
        }

        if (currentView === "detail") {
          root.innerHTML = renderDetail();
          bindDetailEvents();
          return;
        }

        root.innerHTML = renderOverview();
        bindOverviewEvents();
      }

      renderApp();
    </script>
  </body>
  </html>
