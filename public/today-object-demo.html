<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spark Today 对象决策页 Demo</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --sidebar: #eef1f4;
        --surface: #ffffff;
        --surface-subtle: #fafbfb;
        --border: #e1e3e5;
        --border-strong: #c9cdd2;
        --text: #1f2124;
        --text-subtle: #61666c;
        --text-muted: #8c9196;
        --blue: #005bd3;
        --blue-bg: #eef4ff;
        --green: #008060;
        --green-bg: #e9f7ef;
        --orange: #b98900;
        --orange-bg: #fff7e0;
        --red: #d82c0d;
        --red-bg: #fff0ee;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
        --radius-xl: 20px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button {
        font: inherit;
      }

        .app {
          min-height: 100vh;
        }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: #111827;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 14px;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
      }

      .brand p,
      .muted {
        margin: 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.5;
      }

        .panel,
        .page-card,
      .summary-banner,
      .object-card,
      .metric-card,
      .roi-card,
      .next-card {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: var(--radius-lg);
      }

      .panel {
        padding: 14px;
        display: grid;
        gap: 8px;
      }

      .panel h3 {
        margin: 0;
        font-size: 14px;
      }

        .top-intro {
          padding: 24px 24px 0;
          display: grid;
          gap: 16px;
        }

        .top-intro-grid {
          display: grid;
          grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
          gap: 16px;
        }

      .chip {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }

      .chip.green {
        background: var(--green-bg);
        color: var(--green);
      }

      .chip.orange {
        background: var(--orange-bg);
        color: #8a6500;
      }

      .chip.red {
        background: var(--red-bg);
        color: var(--red);
      }

      .chip.blue {
        background: var(--blue-bg);
        color: var(--blue);
      }

        .main {
          padding: 24px;
        display: grid;
        gap: 18px;
      }

      .page-head {
        display: grid;
        gap: 8px;
      }

      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .page-head h2 {
        margin: 0;
        font-size: 30px;
        line-height: 1.15;
      }

      .page-head p {
        margin: 0;
        color: var(--text-subtle);
        line-height: 1.7;
        max-width: 900px;
      }

      .page-card {
        padding: 20px;
      }

      .overview-layout,
      .status-grid,
      .compare-grid,
      .reason-grid,
      .detail-top,
      .detail-metrics,
      .hint-strip,
      .metrics-grid,
      .roi-grid,
      .next-grid,
      .group-grid,
      .object-metrics {
        display: grid;
        gap: 14px;
      }

      .overview-layout {
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
      }

      .summary-banner {
        padding: 18px;
        display: grid;
        gap: 12px;
      }

      .summary-banner h3 {
        margin: 0;
        font-size: 18px;
      }

      .summary-banner strong {
        font-size: 15px;
      }

      .summary-banner p,
      .group-meta,
      .object-card p {
        margin: 0;
        color: var(--text-subtle);
        line-height: 1.7;
      }

      .metrics-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .status-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .reason-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .detail-top {
        grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.75fr);
      }

      .detail-metrics {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .hint-strip {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

        .breakdown-grid {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }

        .breakdown-section {
          display: grid;
          grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
          gap: 14px;
          align-items: start;
        }

        .breakdown-related {
          display: grid;
          gap: 14px;
        }

        .breakdown-card {
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          background: var(--surface-subtle);
          padding: 16px;
          display: grid;
          gap: 12px;
        }

        .breakdown-card h4 {
          margin: 0;
          font-size: 15px;
        }

        .breakdown-card p {
          margin: 0;
          font-size: 12px;
          color: var(--text-subtle);
          line-height: 1.7;
        }

        .breakdown-list {
          display: grid;
          gap: 8px;
        }

        .breakdown-row {
          display: grid;
          grid-template-columns: minmax(120px, 1fr) auto;
          gap: 10px;
          padding-top: 8px;
          border-top: 1px solid var(--border);
        }

        .breakdown-row:first-child {
          padding-top: 0;
          border-top: 0;
        }

        .breakdown-row strong {
          display: block;
          font-size: 13px;
          line-height: 1.5;
        }

        .breakdown-row span {
          display: block;
          font-size: 11px;
          color: var(--text-muted);
          line-height: 1.6;
          margin-top: 3px;
        }

        .breakdown-value {
          font-size: 13px;
          font-weight: 800;
          white-space: nowrap;
        }

        .evidence-card {
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          background: #fcfcfd;
          padding: 14px;
          display: grid;
          gap: 12px;
        }

        .evidence-head {
          display: grid;
          gap: 6px;
        }

        .evidence-title {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
        }

        .evidence-title strong {
          font-size: 14px;
          line-height: 1.4;
        }

        .evidence-head p {
          margin: 0;
          font-size: 12px;
          color: var(--text-subtle);
          line-height: 1.6;
        }

        .evidence-list {
          display: grid;
          gap: 8px;
        }

        .evidence-row {
          display: grid;
          gap: 4px;
          padding-top: 8px;
          border-top: 1px solid var(--border);
        }

        .evidence-row:first-child {
          padding-top: 0;
          border-top: 0;
        }

        .evidence-row strong {
          font-size: 13px;
          line-height: 1.4;
        }

        .evidence-meta,
        .evidence-action {
          font-size: 12px;
          color: var(--text-subtle);
          line-height: 1.6;
        }

        .evidence-action {
          color: var(--text);
          font-weight: 600;
        }

      .metric-card,
      .roi-card,
      .next-card {
        padding: 16px;
      }

      .metric-card-head,
      .roi-card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .metric-label,
      .roi-label,
      .card-label {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      .metric-value,
      .roi-value,
      .object-title {
        font-size: 24px;
        font-weight: 800;
        line-height: 1.15;
      }

      .metric-meta,
      .roi-meta {
        font-size: 12px;
        color: var(--text-subtle);
        margin-top: 8px;
      }

      .metric-jump {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--blue);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .roi-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .next-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .next-card strong {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
      }

      .status-panel {
        display: grid;
        gap: 14px;
      }

      .status-big {
        font-size: 30px;
        font-weight: 800;
        line-height: 1.1;
      }

      .status-item {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px;
        background: var(--surface-subtle);
      }

      .status-item span,
      .compare-item span {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .status-item strong,
      .compare-item strong {
        display: block;
        font-size: 20px;
        line-height: 1.15;
      }

      .compare-item {
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        background: #fcfcfd;
      }

      .data-annotation {
        padding-top: 12px;
        border-top: 1px dashed var(--border);
        font-size: 12px;
        color: var(--text-subtle);
        line-height: 1.7;
      }

      .data-annotation strong {
        color: var(--text);
      }

      .reason-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px;
        background: var(--surface-subtle);
        display: grid;
        gap: 10px;
      }

      .reason-card strong {
        font-size: 15px;
      }

      .reason-card p {
        margin: 0;
        font-size: 13px;
        color: var(--text-subtle);
        line-height: 1.7;
      }

      .reason-metric {
        font-size: 22px;
        font-weight: 800;
        line-height: 1.1;
      }

      .reason-meta {
        font-size: 12px;
        color: var(--text-muted);
      }

      .detail-metric-card {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
      }

      .detail-metric-card strong {
        display: block;
        font-size: 22px;
        line-height: 1.1;
      }

      .detail-metric-card span {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .detail-metric-card .compare-meta {
        margin-top: 6px;
      }

      .report-section {
        display: grid;
        gap: 14px;
      }

      .report-conclusion {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
      }

      .report-conclusion strong {
        display: block;
        font-size: 18px;
        line-height: 1.4;
        margin-bottom: 8px;
      }

      .report-conclusion p {
        margin: 0;
        font-size: 13px;
        color: var(--text-subtle);
        line-height: 1.8;
      }

      .analysis-list {
        display: grid;
        gap: 10px;
      }

      .analysis-item {
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-subtle);
        font-size: 13px;
        color: var(--text-subtle);
        line-height: 1.8;
      }

      .analysis-item strong {
        color: var(--text);
      }

      .hint-item {
        padding: 10px 12px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        background: #fbfcfd;
        font-size: 12px;
        color: var(--text-subtle);
        line-height: 1.6;
      }

      .light-entry {
        padding: 12px 14px;
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        background: #fcfcfd;
        font-size: 13px;
        color: var(--text-subtle);
        line-height: 1.6;
      }

      .light-entry strong {
        color: var(--text);
        margin-right: 6px;
      }

      .compare-meta {
        margin-top: 6px;
        font-size: 12px;
        color: var(--text-subtle);
      }

      .metric-delta {
        font-weight: 700;
      }

      .metric-delta.positive {
        color: var(--green);
      }

      .metric-delta.negative {
        color: var(--red);
      }

      .group-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .group-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .object-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px;
        background: var(--surface-subtle);
        display: grid;
        gap: 10px;
      }

      .object-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .object-title {
        font-size: 17px;
      }

      .object-metrics {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .mini {
        display: grid;
        gap: 4px;
      }

      .mini span {
        font-size: 11px;
        color: var(--text-muted);
      }

      .mini strong {
        font-size: 14px;
      }

      .action-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 700;
        border: 1px solid transparent;
      }

      .action.primary {
        background: var(--blue-bg);
        color: var(--blue);
      }

      .action.warning {
        background: var(--orange-bg);
        color: #8a6500;
      }

      .action.danger {
        background: var(--red-bg);
        color: var(--red);
      }

      .modal-shell {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(15, 23, 42, 0.4);
        z-index: 1000;
      }

      .modal-shell.is-open {
        display: flex;
      }

      .modal-panel {
        width: min(1280px, 100%);
        max-height: calc(100vh - 48px);
        overflow: auto;
        padding: 20px;
        border-radius: 24px;
        background: #f3f5f9;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.18);
      }

      .modal-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .modal-head h3 {
        margin: 6px 0 0;
        font-size: 26px;
        line-height: 1.2;
      }

      .modal-head p {
        margin: 8px 0 0;
        color: var(--text-subtle);
        line-height: 1.6;
      }

      .modal-close {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .modal-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .ai-link {
        border: 1px solid rgba(59, 130, 246, 0.2);
        background: #eff6ff;
        color: var(--blue);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .ai-panel {
        width: min(920px, 100%);
      }

      .ai-layout {
        display: grid;
        gap: 16px;
      }

      .ai-context-card,
      .ai-thread {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .ai-context-card {
        display: grid;
        gap: 12px;
      }

      .ai-tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .ai-tag {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 700;
        background: #eef2ff;
        color: #4338ca;
      }

      .ai-context-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .ai-context-item {
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius-md);
        padding: 12px;
        background: #fcfcfd;
        display: grid;
        gap: 6px;
      }

      .ai-context-item strong {
        font-size: 13px;
      }

      .ai-context-item p {
        margin: 0;
        font-size: 12px;
        color: var(--text-subtle);
        line-height: 1.7;
      }

      .ai-thread {
        display: grid;
        gap: 12px;
      }

      .ai-message {
        display: grid;
        gap: 6px;
      }

      .ai-message span {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .ai-bubble {
        border-radius: 18px;
        padding: 14px 16px;
        font-size: 13px;
        line-height: 1.8;
        white-space: pre-wrap;
      }

      .ai-bubble.user {
        background: #eff6ff;
        color: #1d4ed8;
      }

      .ai-bubble.assistant {
        background: #f8fafc;
        color: var(--text);
      }

      .showcase-card {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .showcase-list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .showcase-intro {
        margin-top: 12px;
      }

      .showcase-header {
        display: grid;
        grid-template-columns: 44px minmax(180px, 1fr) minmax(220px, 1.1fr) minmax(220px, 1.2fr) minmax(180px, 0.9fr);
        gap: 12px;
        padding: 0 0 6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .showcase-row {
        display: grid;
        grid-template-columns: 44px minmax(180px, 1fr) minmax(220px, 1.1fr) minmax(220px, 1.2fr) minmax(180px, 0.9fr);
        gap: 12px;
        align-items: start;
        padding: 12px 0;
        border-top: 1px solid var(--border);
      }

      .showcase-row:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .showcase-rank {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: var(--surface-subtle);
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        color: var(--text-subtle);
      }

      .showcase-name strong {
        display: block;
        font-size: 14px;
      }

      .showcase-name span,
      .showcase-suggestion {
        font-size: 12px;
        color: var(--text-subtle);
        line-height: 1.6;
      }

      .showcase-conclusion-text {
        font-size: 12px;
        color: var(--text-subtle);
        line-height: 1.7;
      }

      .showcase-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .showcase-pill {
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--surface-subtle);
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-subtle);
      }

      .more-link {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--blue);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .jump-link {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--blue);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 700;
      }

      @media (max-width: 1200px) {
        .overview-layout,
        .status-grid,
        .reason-grid,
        .detail-top,
        .detail-metrics,
        .breakdown-section,
          .breakdown-grid,
          .breakdown-related,
        .hint-strip,
        .group-grid,
        .metrics-grid,
        .roi-grid,
        .next-grid,
        .object-metrics {
          grid-template-columns: 1fr;
        }
      }

        @media (max-width: 900px) {
          .top-intro-grid {
            grid-template-columns: 1fr;
          }

          .modal-shell {
            padding: 12px;
          }

          .modal-panel {
            max-height: calc(100vh - 24px);

      function mini(label, value) {
        return { label, value };
      }

        return { label, tone };
      }

      function item(title, kind, metrics, summary, actions) {
        return { title, kind, metrics, summary, actions };
      }

      function breakdown(title, summary, rows, relatedGroupTitles = []) {
        return { title, summary, rows, relatedGroupTitles };
      }

      function breakdownRow(label, value, meta) {
        return { label, value, meta };
      }

      function withTopTen(items) {
        const base = [...items];
        if (base.length >= 10) return base.slice(0, 10);
        const result = [...base];
        let index = 0;
        while (result.length < 10) {
          const source = base[index % base.length];
          const cloneIndex = result.length + 1;
          result.push({
            ...source,
            title: `${source.title} ${cloneIndex}`,
            summary: source.summary,
            metrics: source.metrics.map((metric, metricIndex) => ({
              label: metric.label,
              value:
                metricIndex === 0
                  ? `${metric.value}`
                  : metric.value,
            })),
            actions: [...source.actions],
          });
          index += 1;
        }
        return result;
      }

      function slugify(value) {
        return value
          .toLowerCase()
          .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function chipClass(status) {
        if (status === "healthy") return "green";
        if (status === "watch") return "orange";
        if (status === "risk") return "red";
        return "blue";
      }

      function statusLabel(status) {
        if (status === "healthy") return "健康";
        if (status === "watch") return "关注";
        if (status === "risk") return "风险";
        return "信息";
      }

      function renderShowcaseRow(item, index) {

      function renderAnalysisItem(content, index) {

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDeltaText(value) {
        return escapeHtml(value).replace(
          /([+-])(\d+(?:\.\d+)?)(%|pp)/g,
          (_, sign, number, unit) =>
            `<span class="metric-delta ${sign === "+" ? "positive" : "negative"}">${sign}${Number(number).toFixed(2)}${unit}</span>`,
        );
      }

      function buildItemConclusion(item) {
        const primaryAction = item.actions[0]?.label ?? "继续观察";
        return `${item.summary} 当前更适合的处理方式是“${primaryAction}”，这也是这条对象现在更值得优先执行的动作。`;
      }

      function renderBreakdownCard(block) {
        return `
          <section class="breakdown-card">
            <div>
              <h4>${block.title}</h4>
              <p>${block.summary}</p>
            </div>
            <div class="breakdown-list">
              ${block.rows.map(renderBreakdownRow).join("")}
            </div>
          </section>
        `;
      }

      function renderBreakdownSection(block, groups) {
        const relatedGroups = (block.relatedGroupTitles || [])
          .map((title) => {
            const groupIndex = groups.findIndex((group) => group.title === title);
            return groupIndex >= 0 ? { group: groups[groupIndex], groupIndex } : null;
          })
          .filter(Boolean);

        return `
          <section class="breakdown-section">
            ${renderBreakdownCard(block)}
            ${
              relatedGroups.length
                ? `<div class="breakdown-related">
              ${relatedGroups.map(({ group, groupIndex }) => renderEvidenceCard(group, groupIndex)).join("")}
            </div>`
                : ""
            }
          </section>
        `;
      }

      function renderBreakdownRow(row) {
        return `
          <div class="breakdown-row">
            <div>
              <strong>${row.label}</strong>
              <span>${formatDeltaText(row.meta)}</span>
            </div>
            <div class="breakdown-value">${formatDeltaText(row.value)}</div>
          </div>
        `;
      }

      function reasonCard(title, value, label, meta, summary, nextStep, tone) {
        return `
          <div class="reason-card">
            <div class="chip ${tone}">${label}</div>
            <strong>${title}</strong>
            <div class="reason-metric">${formatDeltaText(value)}</div>
            <div class="reason-meta">${formatDeltaText(meta)}</div>
            <p>${formatDeltaText(summary)}</p>
            <div class="action-row">
              <span class="action ${tone === "red" ? "danger" : tone === "orange" ? "warning" : "primary"}">${nextStep}</span>
            </div>
          </div>
        `;
      }

      function render() {
        const page = pages[activeKey];
        const pageRenderer = page.render ?? renderDetail;
        pageHead.innerHTML = `
          <div class="eyebrow">${page.eyebrow}</div>
          <h2>${page.title}</h2>
          <p>${page.subtitle}</p>

        pageContent.innerHTML = pageRenderer(page);
        bindJumpLinks();

      function bindJumpLinks() {
        document.querySelectorAll("[data-target-page]").forEach((button) => {
          button.addEventListener("click", () => {
            activeKey = button.dataset.targetPage;
            render();
          });
        });

        document.querySelectorAll("[data-c-report-index]").forEach((button) => {
          button.addEventListener("click", () => {
            const index = Number(button.dataset.cReportIndex);
            openCReportModal(index);
          });
        });

        document.querySelectorAll("[data-ai-scope]").forEach((button) => {
          button.addEventListener("click", () => {
            openAiChatModal(button.dataset.aiScope);
          });
        });
      }

      function openCReportModal(groupIndex) {
        const page = pages[activeKey];
        const group = page.groups?.[groupIndex];
        if (!group) return;

        cReportTitle.textContent = group.title;
        cReportSubtitle.textContent = `${page.title} / ${group.summary}`;
        cReportBody.innerHTML = renderDataShowcase(group, groupIndex);
        openCReportAi.dataset.groupIndex = String(groupIndex);
        cReportModal.classList.add("is-open");
        cReportModal.setAttribute("aria-hidden", "false");
        syncBodyScrollLock();
      }

      function closeCReportModal() {
        cReportModal.classList.remove("is-open");
        cReportModal.setAttribute("aria-hidden", "true");
        cReportBody.innerHTML = "";
        openCReportAi.dataset.groupIndex = "";
        syncBodyScrollLock();
      }

      function openAiChatModal(scope) {
        const page = pages[activeKey];
        let payload = null;

        if (scope === "overview") {
          payload = buildOverviewAiPayload();
        } else if (scope === "page") {
          payload = buildPageAiPayload(page);
        } else if (scope === "group") {
          const groupIndex = Number(openCReportAi.dataset.groupIndex);
          const group = page.groups?.[groupIndex];
          if (!group) return;
          payload = buildGroupAiPayload(page, group);
        }

        if (!payload) return;

        aiChatEyebrow.textContent = payload.eyebrow;
        aiChatTitle.textContent = payload.title;
        aiChatSubtitle.textContent = payload.subtitle;
        aiChatBody.innerHTML = renderAiChatBody(payload);
        aiChatModal.classList.add("is-open");
        aiChatModal.setAttribute("aria-hidden", "false");
        syncBodyScrollLock();
      }

      function closeAiChatModal() {
        aiChatModal.classList.remove("is-open");
        aiChatModal.setAttribute("aria-hidden", "true");
        aiChatBody.innerHTML = "";
        syncBodyScrollLock();
      }

      function syncBodyScrollLock() {
        const hasOpenModal =
          cReportModal.classList.contains("is-open") || aiChatModal.classList.contains("is-open");
        document.body.style.overflow = hasOpenModal ? "hidden" : "";
      }

      cReportClose.addEventListener("click", closeCReportModal);
      openCReportAi.addEventListener("click", () => openAiChatModal("group"));
      cReportModal.addEventListener("click", (event) => {
        if (event.target === cReportModal) {
          closeCReportModal();
        }
      });
      aiChatClose.addEventListener("click", closeAiChatModal);
      aiChatModal.addEventListener("click", (event) => {
        if (event.target === aiChatModal) {
          closeAiChatModal();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && cReportModal.classList.contains("is-open")) {
          closeCReportModal();
        }
        if (event.key === "Escape" && aiChatModal.classList.contains("is-open")) {
          closeAiChatModal();
        }
      });

      render();
    </script>
  </body>
</html>
