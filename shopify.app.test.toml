# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "940b967eda872dd81f9ffc283e29a013"
name = "AiAssistant-Test"
application_url = "https://aiassistant-wi7b.onrender.com"
embedded = true

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "/webhooks/app/subscriptions_update"

[[webhooks.subscriptions]]
topics = ["app_purchases_one_time/update"]
uri = "/webhooks/app/purchases_one_time_update"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
topics = ["orders/paid"]
uri = "/webhooks/orders/paid"

[[webhooks.subscriptions]]
topics = ["orders/cancelled"]
uri = "/webhooks/orders/cancelled"

[[webhooks.subscriptions]]
topics = ["refunds/create"]
uri = "/webhooks/refunds/create"

[[webhooks.subscriptions]]
topics = ["inventory_levels/update"]
uri = "/webhooks/inventory_levels/update"

[[webhooks.subscriptions]]
topics = ["fulfillments/create"]
uri = "/webhooks/fulfillments/create"

[[webhooks.subscriptions]]
topics = ["fulfillments/update"]
uri = "/webhooks/fulfillments/update"

[app_proxy]
  url = "https://aiassistant-wi7b.onrender.com/api/image-proxy"
  subpath = "ciwi-spark"
  prefix = "a"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# 审核期临时关闭 5.1.5：去掉 write_pixels,read_customer_events,read_pixels。过审后加回。
scopes = "read_orders,write_products,read_locales,read_translations,write_translations,read_content,read_fulfillments,read_inventory,read_locations,read_products,read_themes,read_reports"

[auth]
redirect_urls = [
  "https://aiassistant-wi7b.onrender.com/auth/callback",
  "https://aiassistant-wi7b.onrender.com/auth/shopify/callback",
]

[build]
automatically_update_urls_on_dev = true

[shop.metafields.app.google_remarketing_config]
type = "json"
name = "Google remarketing configuration"
access.admin = "merchant_read"
